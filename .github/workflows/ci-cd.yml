name: CI/CD Todo App (Minikube)

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout du code
      - uses: actions/checkout@v3

      # 2️⃣ Installer Minikube (si besoin)
      - name: Setup Minikube
        run: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          minikube start --driver=docker

      # 3️⃣ Configurer Docker pour utiliser Minikube
      - name: Configure Docker to use Minikube
        run: minikube -p minikube docker-env --shell powershell | Invoke-Expression

      # 4️⃣ Build backend dans Docker Minikube
      - name: Build backend
        run: docker build -t todo-backend:latest ./backend

      # 5️⃣ Build frontend dans Docker Minikube
      - name: Build frontend
        run: docker build -t todo-frontend:latest ./frontend

      # 6️⃣ Appliquer les manifests Kubernetes
      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml

      # 7️⃣ Vérifier l’état des pods
      - name: Check pods
        run: kubectl get pods
