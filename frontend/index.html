<!doctype html>
<html>
  <head>
    <title>Todo App</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background: white;
        padding: 20px;
        border-radius: 15px;
        width: 350px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h1 {
        text-align: center;
        color: #333;
      }

      .input-group {
        display: flex;
        margin-bottom: 15px;
      }

      input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
      }

      button {
        margin-left: 10px;
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background: #667eea;
        color: white;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #5a67d8;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        background: #f4f4f4;
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.3s;
      }

      li:hover {
        transform: scale(1.02);
      }

      .delete-btn {
        background: red;
        border: none;
        color: white;
        border-radius: 5px;
        padding: 5px 8px;
        cursor: pointer;
      }

      .delete-btn:hover {
        background: darkred;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Todo List</h1>

      <div class="input-group">
        <input id="taskInput" placeholder="Ajouter une tache..." />
        <button onclick="addTask()">Ajouter</button>
      </div>

      <ul id="list"></ul>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
